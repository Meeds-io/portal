spring.jpa.open-in-view=false
# Essential to not have collision between Spring Controller DispatcherServlet and Portlet Container Dispatcher
spring.mvc.servlet.path=/rest
server.error.include-message=always
# Jackson 3 (Spring Boot 4) changed defaults that Spring Boot does not reset. Restore the
# Jackson 2 REST wire contract platform-wide (every WAR imports this file, including the ones
# that do not scan io.meeds.spring.web):
# - FAIL_ON_NULL_FOR_PRIMITIVES became true: an explicit JSON null on a long/int/boolean DTO
#   field turned into a 400 instead of 0/false
# - WRITE/READ_ENUMS_USING_TO_STRING became true: an enum overriding toString() changed its
#   JSON representation and stopped accepting its name() on input
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.datatype.enum.write-enums-using-to-string=false
spring.jackson.datatype.enum.read-enums-using-to-string=false